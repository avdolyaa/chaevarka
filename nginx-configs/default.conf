map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name teavibe.site www.teavibe.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name teavibe.site www.teavibe.site;

    ssl_certificate     /etc/letsencrypt/live/teavibe.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teavibe.site/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/         { proxy_pass http://api:8000; }
    location ^~ /docs         { proxy_pass http://api:8000/docs; }
    location ^~ /openapi.json { proxy_pass http://api:8000/openapi.json; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}