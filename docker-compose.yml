version: '3.8'

services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "chaevarka"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      - backend_net

  api:
    build:
      context: ./chaevarka-server
    ports:
      - "8000:8000"
    container_name: api
    restart: unless-stopped
    environment:
      - TEA_RUN__HOST
      - TEA_RUN__PORT
      - TEA_DB__URL
      - TEA_DB__ECHO
    volumes:
      - ./chaevarka-server:/app
    networks:
      - backend_net

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

networks:
  backend_net:
    driver: bridge