version: '3.8'

services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      - backend_net

  api:
    build:
      context: ./chaevarka-server
    ports:
      - "8000:8000"
    container_name: api
    restart: unless-stopped
    environment:
      - TEA_RUN__HOST
      - TEA_RUN__PORT
      - TEA_DB__URL
      - TEA_DB__ECHO
      - TEA_RUN__HOST
      - TEA_RUN__PORT
      - TEA_DB__URL
      - TEA_DB__ECHO
      - TEA_ACCESS_TOKEN__RESET_PASSWORD_TOKEN_SECRET
      - TEA_ACCESS_TOKEN__VERIFICATION_TOKEN_SECRET
      - TEA_SUPERUSER_EMAIL
      - TEA_SUPERUSER_PASSWORD
      - TEA_SUPERUSER_FIRST_NAME
      - TEA_SUPERUSER_LAST_NAME
      - TEA_SUPERUSER_PHONE
    networks:
      - backend_net

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "1025:1025"
    networks:
      - backend_net
    logging:
      driver: "json-file"
      options:
        max-size: "1m"


  nginx:
    build:
      context: .
      dockerfile: build-app/nginx/Dockerfile
    ports:
      - "5050:80"
    depends_on:
      - api

networks:
  backend_net:
    driver: bridge