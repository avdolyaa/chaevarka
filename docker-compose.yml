services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/postgresql/data
    mem_limit: 512m
    networks:
      - backend_net

  api:
    build:
      context: ./chaevarka-server
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge