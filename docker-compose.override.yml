services:
  pg:
    ports: 
      - "5432:5432"

  maildev:
    image: maildev/maildev
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      - backend_net
    ports:
      - "1080:1080"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        
  nginx:
    build:
      context: .
      dockerfile: build-app/nginx/Dockerfile.local
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - backend_net
